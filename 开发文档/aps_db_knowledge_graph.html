<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>APS 数据库知识图谱</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei',sans-serif;background:#0f1117;color:#e0e6f0;height:100vh;display:flex;flex-direction:column}
#hdr{padding:10px 18px;background:#1a1d2e;border-bottom:1px solid #2d3150;display:flex;align-items:center;gap:14px;flex-shrink:0}
#hdr h1{font-size:17px;color:#7eb8f7;white-space:nowrap}
#legend{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.ld{display:flex;align-items:center;gap:5px;font-size:11px}
.ldot{width:10px;height:10px;border-radius:50%}
#tb{padding:7px 14px;background:#13162a;border-bottom:1px solid #2d3150;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
#search{background:#1e2140;border:1px solid #3a3f6b;color:#e0e6f0;padding:5px 10px;border-radius:5px;width:220px;font-size:12px}
#search:focus{outline:none;border-color:#7eb8f7}
.fb{background:#1e2140;border:1px solid #3a3f6b;color:#a0a8c8;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.fb.on{background:#2d4070;border-color:#7eb8f7;color:#7eb8f7}
#tip{font-size:11px;color:#505870;margin-left:auto}
#main{display:flex;flex:1;overflow:hidden}
#gc{flex:1;position:relative;min-height:0}
#network{width:100%;height:100%}
#dp{width:0;background:#1a1d2e;border-left:0px solid #2d3150;overflow:hidden;flex-shrink:0;transition:width .2s,border-width .2s;display:flex;flex-direction:column}
#dp.open{width:360px;border-left-width:1px}
#dph{padding:12px 14px;background:#13162a;border-bottom:1px solid #2d3150;display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
#pt{font-size:14px;font-weight:bold;color:#7eb8f7}
#pdb{font-size:10px;color:#888;margin-top:2px}
#cpb{background:none;border:none;color:#888;cursor:pointer;font-size:18px;line-height:1}
#cpb:hover{color:#e0e6f0}
#dpb{padding:12px 14px;flex:1;overflow-y:auto}
.st{font-size:10px;color:#7eb8f7;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;border-bottom:1px solid #2d3150;padding-bottom:3px}
.pu{font-size:12px;color:#b0b8d0;line-height:1.65}
table.ct{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
table.ct th{color:#888;font-weight:normal;padding:4px 5px;text-align:left;border-bottom:1px solid #252840;background:#13162a;white-space:nowrap}
table.ct td{padding:4px 5px;border-bottom:1px solid #1e2140;color:#c0c8e0;word-break:break-all;vertical-align:top}
table.ct tr:hover td{background:#1e2240}
.bpk{background:#1e3010;color:#8acc60;border:1px solid #2a4018;border-radius:3px;padding:1px 4px;font-size:9px}
.bfk{background:#1e2a10;color:#f0b060;border:1px solid #2a3818;border-radius:3px;padding:1px 4px;font-size:9px}
.ri{padding:5px 3px;font-size:11px;color:#a0a8c8;border-bottom:1px solid #1e2140;cursor:pointer}
.ri:hover{color:#7eb8f7}
</style>
</head>
<body>
<div id="hdr">
  <h1>🗄 APS 数据库知识图谱</h1>
  <div id="legend">
    <div class="ld"><div class="ldot" style="background:#4A90D9"></div>主数据</div>
    <div class="ld"><div class="ldot" style="background:#E67E22"></div>计划/订单</div>
    <div class="ld"><div class="ldot" style="background:#27AE60"></div>库存/供给</div>
    <div class="ld"><div class="ldot" style="background:#8E44AD"></div>BOM处理</div>
    <div class="ld"><div class="ldot" style="background:#2980B9"></div>ODS</div>
    <div class="ld"><div class="ldot" style="background:#C0392B"></div>Auth</div>
  </div>
</div>
<div id="tb">
  <input id="search" type="text" placeholder="🔍 搜索表名…" oninput="onSearch(this.value)">
  <button class="fb on" onclick="setFilter('all',this)">全部</button>
  <button class="fb" onclick="setFilter('master',this)">主数据</button>
  <button class="fb" onclick="setFilter('plan',this)">计划/订单</button>
  <button class="fb" onclick="setFilter('inv',this)">库存/供给</button>
  <button class="fb" onclick="setFilter('bom',this)">BOM处理</button>
  <button class="fb" onclick="setFilter('ods',this)">ODS</button>
  <button class="fb" onclick="setFilter('auth',this)">Auth</button>
  <span id="tip">点击节点查看详情 · 滚轮缩放 · 拖拽平移</span>
</div>
<div id="main">
  <div id="gc"><div id="network"></div></div>
  <div id="dp">
    <div id="dph">
      <div><div id="pt">-</div><div id="pdb">-</div></div>
      <button id="cpb" onclick="closePanel()">×</button>
    </div>
    <div id="dpb">
      <div class="st">用途说明</div>
      <div class="pu" id="ppurpose"></div>
      <div class="st">字段列表</div>
      <div id="pcols"></div>
      <div class="st">关联表</div>
      <div id="prels"></div>
    </div>
  </div>
</div>
<script>
const TD={
 ProductFamily:{db:'APS_Production·主数据',pu:'产品族维度（整机/气缸等），是分域排程核心维度，所有订单/物料/资源均归属某产品族。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'Code',t:'NVARCHAR(50)',m:'唯一代码'},{n:'Name',t:'NVARCHAR(200)',m:'名称'},{n:'IsActive',t:'BIT',m:'是否启用'}]},
 Factory:{db:'APS_Production·主数据',pu:'多工厂（CN/BJ/TJ/SH），支持跨厂协同排程与资源隔离。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'Code',t:'NVARCHAR(50)',m:'工厂代码'},{n:'Name',t:'NVARCHAR(200)',m:'名称'},{n:'TimeZone',t:'NVARCHAR(50)',m:'时区'},{n:'IsActive',t:'BIT',m:'是否启用'}]},
 Material:{db:'APS_Production·主数据',pu:'物料主数据，BOM/Routing/Order核心FK锚点。含LLC（低阶码）用于Kahn拓扑排序。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'MaterialCode',t:'NVARCHAR(100)',m:'物料编码'},{n:'ProductFamilyId',t:'INT',f:'fk',m:'产品族'},{n:'MaterialType',t:'NVARCHAR(50)',m:'FINISHED/SEMI/RAW'},{n:'LowLevelCode',t:'INT',m:'LLC，0=顶层'},{n:'IsActive',t:'BIT',m:'是否启用'}]},
 BOM:{db:'APS_Production·主数据',pu:'本地BOM父子装配关系，从ODS展开结果同步，支持SCD有效期管理。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'ParentMaterialId',t:'INT',f:'fk',m:'父物料'},{n:'ChildMaterialId',t:'INT',f:'fk',m:'子物料'},{n:'Quantity',t:'DECIMAL(18,6)',m:'用量'},{n:'EffectiveFrom',t:'DATETIME2',m:'生效日期'},{n:'EffectiveTo',t:'DATETIME2',m:'失效日期'}]},
 Resource:{db:'APS_Production·主数据',pu:'生产资源（机台/人工/产线），承载有限产能约束，排程的核心负荷单元。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'Code',t:'NVARCHAR(50)',m:'资源编码'},{n:'FactoryId',t:'INT',f:'fk',m:'工厂'},{n:'ProductFamilyId',t:'INT',f:'fk',m:'产品族'},{n:'ResourceType',t:'NVARCHAR(50)',m:'MACHINE/LABOR/LINE'},{n:'Capacity',t:'DECIMAL(10,4)',m:'基准产能/小时'}]},
 ResourceCalendar:{db:'APS_Production·主数据',pu:'资源日历，定义每个资源每日可用时段（班次/停机/节假日），排程引擎直接消费。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'ResourceId',t:'INT',f:'fk',m:'资源'},{n:'CalDate',t:'DATE',m:'日期'},{n:'ShiftCode',t:'NVARCHAR(50)',m:'班次代码'},{n:'StartTime',t:'TIME',m:'开始时间'},{n:'EndTime',t:'TIME',m:'结束时间'},{n:'IsWorking',t:'BIT',m:'是否工作'}]},
 RoutingOperation:{db:'APS_Production·主数据',pu:'工序路由，定义物料在哪个资源上加工多长时间，是任务分解的模板。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'MaterialId',t:'INT',f:'fk',m:'物料'},{n:'ResourceId',t:'INT',f:'fk',m:'资源'},{n:'StageId',t:'INT',f:'fk',m:'工段'},{n:'RunTimeMins',t:'DECIMAL(10,4)',m:'标准工时(分)'},{n:'Sequence',t:'INT',m:'工序顺序'}]},
 StageDict:{db:'APS_Production·主数据',pu:'工段字典，定义制造工段层级（铸造/机加/装配等），是物料流转路径的节点。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'Code',t:'NVARCHAR(50)',m:'工段代码'},{n:'Name',t:'NVARCHAR(200)',m:'名称'},{n:'Level',t:'INT',m:'层级'},{n:'ParentId',t:'INT',f:'fk',m:'父工段'}]},
 ProductionDepartment:{db:'APS_Production·主数据',pu:'生产部门，与工段关联，用于物料工段上下文（MaterialStageDeptContext）的部门维度。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'Code',t:'NVARCHAR(50)',m:'部门编码'},{n:'Name',t:'NVARCHAR(200)',m:'部门名称'},{n:'FactoryId',t:'INT',f:'fk',m:'工厂'}]},
 MaterialStageDeptContext:{db:'APS_Production·主数据',pu:'物料工段部门上下文，SCD Type2，定义物料在哪个工段由哪个部门生产，解决跨部门产线共享问题。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'MaterialId',t:'INT',f:'fk',m:'物料'},{n:'StageId',t:'INT',f:'fk',m:'工段'},{n:'DeptId',t:'INT',f:'fk',m:'部门'},{n:'ValidFrom',t:'DATETIME2',m:'生效'},{n:'ValidTo',t:'DATETIME2',m:'失效'},{n:'IsCurrent',t:'BIT',m:'当前有效'}]},
 MaterialMapping:{db:'APS_Production·主数据',pu:'ERP物料码→APS物料码映射，SCD Type2，支持历史追溯。返回列表，不可盲目.First()。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'ErpCode',t:'NVARCHAR(100)',m:'ERP物料码'},{n:'ApsMaterialId',t:'INT',f:'fk',m:'APS物料'},{n:'Priority',t:'INT',m:'优先级'},{n:'ValidFrom',t:'DATETIME2',m:'生效'},{n:'IsCurrent',t:'BIT',m:'当前有效'}]},
 FenceConfig:{db:'APS_Production·主数据',pu:'冻结栅栏配置，定义产品族的订单冻结期（不可调整区间）。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'ProductFamilyId',t:'INT',f:'fk',m:'产品族'},{n:'FenceType',t:'NVARCHAR(50)',m:'FROZEN/SLUSHY'},{n:'FenceDays',t:'INT',m:'冻结天数'},{n:'IsActive',t:'BIT',m:'是否启用'}]},
 CustomerCodeMap:{db:'APS_Production·主数据',pu:'客户代码→物料映射，将ERP客户代码转换为APS可识别的物料维度。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'CustomerCode',t:'NVARCHAR(100)',m:'客户代码'},{n:'MaterialId',t:'INT',f:'fk',m:'物料'},{n:'FactoryId',t:'INT',f:'fk',m:'工厂'}]},
 ProduceToFactoryMap:{db:'APS_Production·主数据',pu:'生产归属工厂映射，定义某物料应由哪个工厂生产（多工厂协同路由规则）。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'MaterialId',t:'INT',f:'fk',m:'物料'},{n:'TargetFactoryId',t:'INT',f:'fk',m:'目标工厂'},{n:'Priority',t:'INT',m:'优先级'}]},
 ScheduleRun:{db:'APS_Production·计划/订单',pu:'每次排程触发记录，追踪排程运行状态与耗时。PlanVersion的父表。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'RunType',t:'NVARCHAR(50)',m:'FULL/INCREMENTAL'},{n:'Status',t:'NVARCHAR(20)',m:'Running/Done/Failed'},{n:'StartedAt',t:'DATETIME2',m:'开始时间'},{n:'FinishedAt',t:'DATETIME2',m:'完成时间'}]},
 PlanVersion:{db:'APS_Production·计划/订单',pu:'排程计划版本，每次排程产生一个版本，分区键。Order/Task/Pegging/Summary都按此分区。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'ScheduleRunId',t:'INT',f:'fk',m:'排程运行'},{n:'VersionName',t:'NVARCHAR(100)',m:'版本名称'},{n:'IsPublished',t:'BIT',m:'是否发布'},{n:'CreatedAt',t:'DATETIME2',m:'创建时间'}]},
 Scenario:{db:'APS_Production·计划/订单',pu:'情景分析，同一排程运行下的多方案对比（悲观/基准/乐观等）。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'PlanVersionId',t:'INT',f:'fk',m:'计划版本'},{n:'ScenarioName',t:'NVARCHAR(100)',m:'情景名'},{n:'ScenarioType',t:'NVARCHAR(50)',m:'BASELINE/PESSIMISTIC/OPTIMISTIC'}]},
 ERP_Order_Staging:{db:'APS_Production·计划/订单',pu:'从ERP同步的原始订单暂存表（防腐层入口），数据质量未经验证，经ETL转换为Order_Canonical。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'ErpOrderNo',t:'NVARCHAR(100)',m:'ERP订单号'},{n:'MaterialCode',t:'NVARCHAR(100)',m:'物料编码'},{n:'Quantity',t:'DECIMAL(18,4)',m:'数量'},{n:'DueDate',t:'DATETIME2',m:'交期'},{n:'SyncedAt',t:'DATETIME2',m:'同步时间'}]},
 Order_Canonical:{db:'APS_Production·计划/订单',pu:'规范化订单，ERP订单经数据清洗/物料映射后的标准形态，是APS排程的需求输入。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'CanonicalOrderNo',t:'NVARCHAR(100)',m:'规范订单号'},{n:'MaterialId',t:'INT',f:'fk',m:'物料'},{n:'Quantity',t:'DECIMAL(18,4)',m:'数量'},{n:'DueDate',t:'DATETIME2',m:'交期'},{n:'Priority',t:'INT',m:'优先级'}]},
 Order:{db:'APS_Production·计划/订单',pu:'排程订单，按PlanVersionId分区。排程引擎的核心计算对象，含计划开工/完工时间。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'PlanVersionId',t:'INT',f:'fk',m:'计划版本'},{n:'MaterialId',t:'INT',f:'fk',m:'物料'},{n:'FactoryId',t:'INT',f:'fk',m:'工厂'},{n:'Quantity',t:'DECIMAL(18,4)',m:'数量'},{n:'PlannedStart',t:'DATETIME2',m:'计划开始'},{n:'PlannedEnd',t:'DATETIME2',m:'计划完成'},{n:'DueDate',t:'DATETIME2',m:'交期'}]},
 Task:{db:'APS_Production·计划/订单',pu:'工序任务，订单分解后的最小排程单元，绑定资源与工序，含具体开工完工时间。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'OrderId',t:'BIGINT',f:'fk',m:'所属订单'},{n:'ResourceId',t:'INT',f:'fk',m:'资源'},{n:'OperationId',t:'INT',f:'fk',m:'工序'},{n:'PlannedStart',t:'DATETIME2',m:'计划开始'},{n:'PlannedEnd',t:'DATETIME2',m:'计划完成'},{n:'Sequence',t:'INT',m:'顺序'}]},
 Pegging:{db:'APS_Production·计划/订单',pu:'需求供给配对（Pegging），记录哪个供应订单满足哪个需求订单的多少数量，支持订单追溯。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'SupplyOrderId',t:'BIGINT',f:'fk',m:'供应订单'},{n:'DemandOrderId',t:'BIGINT',f:'fk',m:'需求订单'},{n:'PeggedQty',t:'DECIMAL(18,4)',m:'配对数量'},{n:'PlanVersionId',t:'INT',f:'fk',m:'计划版本'}]},
 OrderBomRequestLink:{db:'APS_Production·计划/订单',pu:'订单与BOM展开请求的关联表，追踪每个订单触发了哪个BOM请求，支持展开结果回写。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'OrderId',t:'BIGINT',f:'fk',m:'订单'},{n:'RequestId',t:'BIGINT',f:'fk',m:'BOM请求'},{n:'CreatedAt',t:'DATETIME2',m:'创建时间'}]},
 Domain_Dependency:{db:'APS_Production·计划/订单',pu:'跨域计算依赖图，定义各产品族间的排程计算顺序（Kahn拓扑排序输入），由3号位02:00任务消费。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'PlanVersionId',t:'INT',f:'fk',m:'计划版本'},{n:'FromDomain',t:'NVARCHAR(50)',m:'上游域'},{n:'ToDomain',t:'NVARCHAR(50)',m:'下游域'},{n:'DependencyType',t:'NVARCHAR(50)',m:'依赖类型'}]},
 OrderScheduleSummary:{db:'APS_Production·计划/订单',pu:'订单排程汇总，每订单一行的宽表，存储排程结果摘要（延迟天数/满足率/优先级分数），供前端报表直接消费。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'OrderId',t:'BIGINT',f:'fk',m:'订单'},{n:'DelayDays',t:'INT',m:'延迟天数'},{n:'FulfillmentRate',t:'DECIMAL(5,4)',m:'满足率'},{n:'PriorityScore',t:'DECIMAL(10,4)',m:'优先级分'}]},
 ResourceLoadSummary:{db:'APS_Production·计划/订单',pu:'资源负荷汇总，每资源每日一行，展示负荷率/是否瓶颈，供看板和优化决策使用。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'ResourceId',t:'INT',f:'fk',m:'资源'},{n:'PlanVersionId',t:'INT',f:'fk',m:'计划版本'},{n:'LoadDate',t:'DATE',m:'日期'},{n:'LoadRate',t:'DECIMAL(5,4)',m:'负荷率'},{n:'IsBottleneck',t:'BIT',m:'是否瓶颈'}]},
 InventoryFact_ERP:{db:'APS_Production·库存/供给',pu:'ERP原始库存事实表，六层库存架构事实层入口，经同步流程进入候选→规则→明细→余额链路。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'MaterialCode',t:'NVARCHAR(50)',m:'物料编码'},{n:'FactoryId',t:'INT',f:'fk',m:'工厂'},{n:'WarehouseCode',t:'NVARCHAR(50)',m:'仓库编码'},{n:'OnHandQty',t:'DECIMAL(18,4)',m:'现有量'},{n:'SyncedAt',t:'DATETIME2',m:'同步时间'}]},
 InventoryFact_MES:{db:'APS_Production·库存/供给',pu:'MES原始库存事实表，反映车间库位数量（含WIP），与ERP事实表共同作为库存架构事实层。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'MaterialCode',t:'NVARCHAR(50)',m:'物料编码'},{n:'FactoryId',t:'INT',f:'fk',m:'工厂'},{n:'Location',t:'NVARCHAR(100)',m:'车间库位'},{n:'OnHandQty',t:'DECIMAL(18,4)',m:'现有量'},{n:'SyncedAt',t:'DATETIME2',m:'同步时间'}]},
 InventoryAvailabilityRule:{db:'APS_Production·库存/供给',pu:'库存可用性规则，白名单模式定义哪些仓库库存可用于排程扣减及优先级。',cols:[{n:'Id',t:'INT',f:'pk'},{n:'ProductFamilyId',t:'INT',f:'fk',m:'产品族'},{n:'FactoryId',t:'INT',f:'fk',m:'工厂'},{n:'WarehouseCode',t:'NVARCHAR(50)',m:'仓库'},{n:'IsAvailable',t:'BIT',m:'是否可用'},{n:'Priority',t:'INT',m:'扣减优先级'}]},
 InventoryBalance:{db:'APS_Production·库存/供给',pu:'库存余额汇聚表（六层第5层），由明细汇总生成，排程引擎直接消费此表。',cols:[{n:'Id',t:'BIGINT',f:'pk'},{n:'MaterialCode',t:'NVARCHAR(50)',m:'物料编码'},{n:'FactoryId',t:'INT',f:'fk',m:'工厂'},{n:'ProductFamilyId',t:'INT',f:'fk',m:'产品族'},{n:'OnHandQty',t:'DECIMAL(18,4)',m:'可用在手量'},{n:'AllocatedQty',t:'DECIMAL(18,4)',m:'已分配量'},{n:'BatchNo',t:'NVARCHAR(50)',m:'快照批次'}]},

 ['InventoryFact_ERP','Factory','工厂'],['InventoryFact_MES','Factory','工厂'],
 ['InventoryAvailabilityRule','ProductFamily','产品族'],['InventoryAvailabilityRule','Factory','工厂'],
 ['InventoryBalance','Factory','工厂'],['InventoryBalance','ProductFamily','产品族'],
 ['SupplyFact_Pipeline','ProductFamily','产品族'],['APS_BOM_RAW','Factory','工厂'],
 ['APS_BOM_STAGE_PATH_RAW','ProductFamily','产品族'],['StageProgressSnapshot','Order','订单'],
 ['MES_API_BOM_Request','PlanVersion','版本'],['MES_API_BOM_Request_Detail','MES_API_BOM_Request','请求'],
 ['MES_APS_BOM_Workset','PlanVersion','版本'],['MES_APS_BOM_Workset_Issues','MES_APS_BOM_Workset','工作集'],
 ['MES_APS_BOM_Workset_StageDetail','MES_APS_BOM_Workset','工作集'],
 ['UserRole','User','用户'],['UserRole','Role','角色'],['RolePermission','Role','角色'],
 ['RolePermission','Permission','权限'],['DataScopePolicy','Role','角色'],['AuditLog','User','用户'],
 ['ApprovalNode','ApprovalFlow','流程'],['ApprovalNode','Role','审批角色'],
 ['ApprovalRule','ApprovalFlow','流程'],
 ['ApprovalRecord','ApprovalFlow','流程'],['ApprovalRecord','User','发起人'],
 ['RoutingOperation','ProductionDepartment','部门'],
 ['Routing','Material','物料'],['Routing','ResourceGroup','资源组'],
 ['RoutingDependency','Material','物料'],['RoutingDependency','ProductionDepartment','部门'],
 ['Task','ResourceGroup','资源组'],
 ['InventorySupplyCandidate','Factory','工厂'],
 ['InventoryAvailableSupplyDetail','ProductFamily','产品族'],['InventoryAvailableSupplyDetail','Factory','工厂'],
 ['InventoryAvailableSupplyDetail','InventoryAvailabilityRule','规则'],
 ['SupplyAvailabilityRule','ProductFamily','产品族'],
 ['PlanKpiSummary','PlanVersion','版本'],
 ['OperationProgressSnapshot','Order','订单'],
 ['UserDataScope','User','用户'],['RoleDataScope','Role','角色']
];
let curFilter='all';
const allNodeDefs=Object.keys(TD).map(id=>({id,label:id,
 color:{background:getClr(id),border:'#1a1a1a',highlight:{background:getClr(id),border:'#fff'}},
 font:{color:'#fff',size:12,bold:true},shape:'box',borderWidth:2,shadow:true}));
const allEdgeDefs=ED.map(([f,t,l],i)=>({id:i,from:f,to:t,label:l,arrows:'to',
 color:{color:'#555',highlight:'#aaa'},font:{size:9,color:'#888'},
 smooth:{type:'curvedCW',roundness:0.1}}));

const nodesDS=new vis.DataSet(allNodeDefs);
const edgesDS=new vis.DataSet(allEdgeDefs);
const network=new vis.Network(document.getElementById('network'),{nodes:nodesDS,edges:edgesDS},{
 physics:{enabled:true,solver:'forceAtlas2Based',
  forceAtlas2Based:{gravitationalConstant:-60,centralGravity:0.01,springLength:120,springConstant:0.08},
  stabilization:{iterations:300,updateInterval:50}},
 interaction:{hover:true,navigationButtons:true,keyboard:true,tooltipDelay:200},
 nodes:{margin:8},edges:{width:1.5}
});
network.once('stabilized',()=>network.fit({animation:{duration:600,easingFunction:'easeInOutQuad'}}));

network.on('click',p=>{if(p.nodes.length)showPanel(p.nodes[0]);});

function showPanel(id){
 const t=TD[id];if(!t)return;
 document.getElementById('pt').textContent=id;
 document.getElementById('pdb').textContent=t.db;
 document.getElementById('ppurpose').textContent=t.pu;
 const rows=t.cols.map(c=>`<tr><td>${c.n}</td><td style="color:#7eb8f7">${c.t}</td>
  <td>${c.f==='pk'?'<span class="bpk">PK</span>':c.f==='fk'?'<span class="bfk">FK</span>':'—'}</td>
  <td style="color:#808898">${c.m||''}</td></tr>`).join('');
 document.getElementById('pcols').innerHTML=`<table class="ct"><thead><tr>
  <th>字段</th><th>类型</th><th>标志</th><th>说明</th></tr></thead><tbody>${rows}</tbody></table>`;
 const rels=ED.filter(e=>e[0]===id||e[1]===id)
  .map(e=>e[0]===id?`<div class="ri">→ <b>${e[1]}</b> <span style="color:#555">${e[2]}</span></div>`
   :`<div class="ri" onclick="showPanel('${e[0]}')" style="cursor:pointer">← <b>${e[0]}</b> <span style="color:#555">${e[2]}</span></div>`).join('');
 document.getElementById('prels').innerHTML=rels||'<span style="color:#505870">无直接关联</span>';
 document.getElementById('dp').classList.add('open');
}
function closePanel(){document.getElementById('dp').classList.remove('open');}
function setFilter(grp,el){
 curFilter=grp;
 document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
 el.classList.add('on');
 const keep=grp==='all'?new Set(Object.keys(TD)):new Set(GRP[grp]||[]);
 nodesDS.update(allNodeDefs.map(n=>({id:n.id,hidden:!keep.has(n.id)})));
 edgesDS.update(allEdgeDefs.map(e=>({id:e.id,hidden:!(keep.has(e.from)&&keep.has(e.to))})));
 setTimeout(()=>network.fit({animation:true}),100);
}
function onSearch(v){
 const q=v.trim().toLowerCase();
 nodesDS.update(allNodeDefs.map(n=>({id:n.id,hidden:q?!n.id.toLowerCase().includes(q):false})));
}
</script>
</body>
</html>
